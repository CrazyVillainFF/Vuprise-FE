<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('nexora_theme_mode');
          const mode = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          const root = document.documentElement;
          root.dataset.theme = mode;
          root.style.colorScheme = mode;
          root.style.setProperty('--app-bg', mode === 'dark' ? '#000000' : '#FFFFFF');
          root.style.setProperty('--app-fg', mode === 'dark' ? '#FFFFFF' : '#000000');
          root.style.setProperty('--app-fg-rgb', mode === 'dark' ? '255, 255, 255' : '0, 0, 0');
        } catch { /* React applies the selected theme on startup. */ }
      })();
    </script>
    <link rel="icon" type="image/png" href="/reactable-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vuprise | A network for what’s next</title>
    <meta name="description" content="Vuprise is a professional network to share what you’re building, find your people, and make meaningful connections." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:site_name" content="Vuprise" />
    <meta property="og:title" content="Vuprise | A network for what’s next" />
    <meta property="og:description" content="Share what you’re building, find your people, and make meaningful connections on Vuprise." />
    <meta property="og:image" content="__SITE_URL__/share-card.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Vuprise wordmark and tagline on a dark gradient background" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Vuprise | A network for what’s next" />
    <meta name="twitter:description" content="Share what you’re building, find your people, and make meaningful connections on Vuprise." />
    <meta name="twitter:image" content="__SITE_URL__/share-card.png" />
    <meta name="twitter:image:alt" content="Vuprise wordmark and tagline on a dark gradient background" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
  </head>
  <body style="margin: 0; padding: 0; box-sizing: border-box;">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
